<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>rakuan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Mali:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#4f78a8;--ink2:#6f94c0;--sky1:#e6f2ff;--sky2:#f4f9ff;--sky3:#d3e6fb;--paper:#fff8ea;--glow:rgba(255,255,255,.8);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#4a73a3;--sky1:#dcebfb;--sky2:#eef6ff;--sky3:#c6dcf6}}
:root[data-theme="dark"]{--ink:#4a73a3;--sky1:#dcebfb;--sky2:#eef6ff;--sky3:#c6dcf6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:'Mali','Gaegu',sans-serif;color:var(--ink);background:linear-gradient(170deg,var(--sky1) 0%,var(--sky2) 45%,var(--sky3) 100%);user-select:none}
.glow{position:fixed;border-radius:50%;filter:blur(40px);pointer-events:none;background:radial-gradient(circle,var(--glow),transparent 70%);animation:gl 9s ease-in-out infinite alternate}
@keyframes gl{to{transform:translate(20px,-24px) scale(1.15);opacity:.7}}
#fx,#fx2{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.p{position:absolute;left:var(--x);top:-6vh;opacity:0;animation:drift var(--t) linear var(--d) infinite}
.dot{width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%);top:auto;bottom:-5vh;animation-name:rise}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}85%{opacity:.8}100%{transform:translate(var(--w),-112vh);opacity:0}}
@keyframes drift{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.9}90%{opacity:.85}100%{transform:translate(var(--w),112vh) rotate(var(--r));opacity:0}}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility .9s}
.scene.on{opacity:1;visibility:visible}
/* page 1 */
#catwrap{width:min(78vw,330px,40vh);margin-top:-4vh}
#cat{width:100%;overflow:visible;filter:drop-shadow(0 12px 14px rgba(110,150,205,.3))}
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:br 4.2s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.018,1.03)}}
.headg{transform-box:fill-box;transform-origin:50% 90%;animation:hd 6s ease-in-out infinite}
@keyframes hd{0%,100%{transform:rotate(-1.2deg) translateY(0)}50%{transform:rotate(1.4deg) translateY(-2px)}}
.tail{transform-box:view-box;transform-origin:225px 292px;animation:tl 3.6s ease-in-out infinite}
@keyframes tl{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
.ear{transform-box:fill-box;transform-origin:50% 100%;animation:ew 7s ease-in-out infinite}
.ear.r{animation-delay:2.6s}
@keyframes ew{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-7deg)}92%{transform:rotate(3deg)}95%{transform:rotate(-4deg)}}
.eye{transform-box:fill-box;transform-origin:50% 50%;animation:bk 5s infinite}
@keyframes bk{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.06)}}
.tf{transform-box:fill-box;transform-origin:50% 90%;animation:fz var(--d) ease-in-out var(--e) infinite alternate}
@keyframes fz{from{transform:rotate(-4deg)}to{transform:rotate(5deg) scale(1.04)}}
h1{font-family:'Gaegu','Mali',cursive;font-weight:700;font-size:clamp(44px,min(17vw,11vh),84px);margin:2vh 0 0;letter-spacing:2px;color:var(--ink);text-shadow:0 4px 14px rgba(255,255,255,.9);display:flex}
h1 span{display:inline-block;opacity:0;transform:translateY(16px) rotate(var(--r));animation:ti 1.4s cubic-bezier(.2,.8,.3,1) forwards;animation-delay:calc(.5s + var(--i)*.18s)}
@keyframes ti{to{opacity:1;transform:translateY(0) rotate(var(--r))}}
.btn{position:relative;margin-top:3vh;border:0;font-family:'Mali',sans-serif;font-weight:600;font-size:22px;color:#fff;padding:14px 46px;border-radius:40px 44px 38px 46px/44px 38px 46px 40px;background:linear-gradient(160deg,#a9cdf3,#7eaee3);box-shadow:0 10px 22px rgba(110,160,220,.38),inset 0 3px 6px rgba(255,255,255,.55);cursor:pointer;opacity:0;animation:ti2 1s 1.9s forwards,pulse 2.2s 2.9s ease-in-out infinite}
@keyframes ti2{to{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08) translateY(-2px)}}
.btn:active{transform:scale(.95)}
.btn svg{position:absolute;right:8px;top:-6px;width:20px;animation:tw 2s infinite}
@keyframes tw{50%{transform:scale(.6) rotate(30deg);opacity:.5}}
/* page 2 */
#stage{width:min(92vw,400px,62vh);transition:transform 2s cubic-bezier(.65,0,.35,1);cursor:pointer;will-change:transform}
#stage.zoom{cursor:default}
#bq{width:100%;overflow:visible;}
.bl{transform-box:fill-box;transform-origin:50% 50%}
.bl.st{transform-origin:50% 100%}

@keyframes bloom{to{transform:scale(1);opacity:1}}
.sw{transform-box:fill-box;transform-origin:50% 60%;animation:sway var(--s) ease-in-out var(--e) infinite alternate}
.st .sw{transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(calc(var(--r)*-1))}to{transform:rotate(var(--r))}}
.hint{position:absolute;bottom:calc(5vh + env(safe-area-inset-bottom,0px));font-size:17px;padding:9px 22px;border-radius:30px;background:rgba(255,255,255,.7);box-shadow:0 6px 18px rgba(130,170,220,.25);animation:hb 2.4s ease-in-out infinite;transition:opacity .6s;display:flex;gap:8px;align-items:center}
@keyframes hb{50%{transform:translateY(-5px)}}
.flap{transform-origin:196px 316px;transition:transform .8s ease-in-out}
.open .flap{transform:scaleY(-1)}
.sealL,.sealR{transition:transform .7s ease-out,opacity .6s;transform-box:fill-box}
.crack .sealL{transform:translate(-9px,5px) rotate(-26deg);opacity:0}
.crack .sealR{transform:translate(9px,7px) rotate(24deg);opacity:0}
#env{cursor:pointer;opacity:1}
.zoom #env{animation:ep 1.6s ease-in-out infinite}
@keyframes ep{50%{transform:translateY(-3px) scale(1.04)}}
#env{transform-box:fill-box;transform-origin:50% 50%}
/* page 3 */
#letter{position:relative;width:min(88vw,380px);min-height:min(60vh,440px);padding:44px 34px 40px;background:radial-gradient(ellipse at 30% 20%,#fcf9f1,#f6efe0 75%,#efe6d3);border-radius:4px 8px 6px 9px/8px 4px 9px 6px;box-shadow:0 12px 28px rgba(110,140,190,.22),0 1px 3px rgba(150,120,80,.12);transform:translateY(80vh) scale(.5) rotate(3deg);transition:transform 1.8s cubic-bezier(.25,.9,.3,1)}
#letter:before{content:"";position:absolute;inset:0;border-radius:inherit;opacity:.5;background:repeating-linear-gradient(0deg,transparent 0 31px,rgba(170,200,235,.25) 31px 32px),radial-gradient(circle at 80% 90%,rgba(220,190,140,.25),transparent 40%)}
.s3.on #letter{transform:none}
#txt{position:relative;transition:opacity 1.4s ease;font-family:'Mali',cursive;font-size:clamp(17px,5vw,21px);line-height:2;white-space:pre-line;color:#6a8db5;min-height:6em;font-weight:400}
.caret{display:inline-block;width:2px;height:1em;background:var(--ink2);vertical-align:-2px;animation:cr .8s infinite}
@keyframes cr{50%{opacity:0}}
.nav{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;display:flex;gap:10px;z-index:5}
.nb{display:flex;align-items:center;gap:6px;border:0;padding:8px 16px 8px 12px;border-radius:26px;font-family:'Mali',sans-serif;font-size:15px;color:var(--ink);background:rgba(255,255,255,.75);box-shadow:0 5px 14px rgba(120,160,215,.28);cursor:pointer}
.nb svg{width:18px}
.hrt{position:absolute;left:var(--x);bottom:var(--y);width:var(--s);animation:fh var(--t) ease-out forwards;pointer-events:none}
@keyframes fh{0%{transform:translate(0,0) scale(.3) rotate(var(--a));opacity:0}15%{opacity:.95}100%{transform:translate(var(--w),-34vh) scale(1) rotate(calc(var(--a)*-1));opacity:0}}
#flash{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 55%,#fff 0%,#fff 35%,rgba(235,245,255,.96) 100%);transition:opacity .7s ease}
#flash.on{opacity:1}
.sp{position:fixed;z-index:21;left:-12vw;top:var(--y);width:var(--s);pointer-events:none;animation:sweep 1.5s ease-in-out var(--d) forwards}
@keyframes sweep{to{transform:translate(135vw,var(--dy)) rotate(var(--r))}}
#deco{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.dc{position:absolute;opacity:.9;transform:rotate(var(--r));transform-origin:50% 95%;animation:ds 7s ease-in-out infinite alternate}
@keyframes ds{from{transform:rotate(calc(var(--r) - 3deg))}to{transform:rotate(calc(var(--r) + 3deg))}}
.cl{position:absolute;left:0;width:var(--w);opacity:.7;animation:cld var(--t) linear var(--d) infinite}
@keyframes cld{from{transform:translateX(-40vw)}to{transform:translateX(140vw)}}
.sk{position:absolute;width:var(--s);left:var(--x);top:var(--y);animation:tk var(--t) ease-in-out var(--d) infinite}
@keyframes tk{0%,100%{transform:scale(.3) rotate(0);opacity:.2}50%{transform:scale(1) rotate(45deg);opacity:1}}
#mbw{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:15;display:flex;align-items:center;gap:8px}
#ml{font-size:clamp(14px,3.6vw,17px);color:#3f6ea8;padding:6px 12px;border-radius:20px;background:rgba(255,255,255,.7);box-shadow:0 4px 12px rgba(120,160,215,.22);animation:hb 2.4s ease-in-out infinite}
.mb{width:clamp(48px,12vw,60px);height:clamp(48px,12vw,60px);border:0;border-radius:50%;background:rgba(255,255,255,.78);box-shadow:0 5px 14px rgba(120,160,215,.3);display:grid;place-items:center;cursor:pointer}
.mb svg{width:58%}.mb .sl{opacity:0}.mb.off .sl{opacity:1}
.bn{overflow:visible;transform-origin:50% 0;animation:bsw 5s ease-in-out infinite alternate}
@keyframes bsw{from{transform:rotate(-.9deg)}to{transform:rotate(.9deg)}}
.pw{position:absolute;width:26px;left:var(--x);bottom:var(--y);opacity:0;transform:rotate(var(--r));animation:pwf 9s ease-in-out var(--d) infinite}
@keyframes pwf{0%,100%{opacity:0}12%,55%{opacity:.6}}
.bgcat{position:absolute;pointer-events:none;width:min(40vw,170px);left:3vw;bottom:calc(9vh + 46px)}
.bgcat svg{width:100%;overflow:visible;filter:drop-shadow(0 8px 10px rgba(110,150,205,.25))}
.bgcat.c3{left:auto;right:3vw;bottom:calc(4vh + 64px);width:min(34vw,150px)}
.rb{position:absolute;opacity:.92;animation:bobb 6s ease-in-out infinite alternate}
@keyframes bobb{to{transform:translateY(-6px)}}
.bal{position:absolute;transform-origin:50% 100%;animation:bal 5s ease-in-out infinite alternate}
@keyframes bal{from{transform:rotate(-4deg) translateY(0)}to{transform:rotate(4deg) translateY(-8px)}}
.sw2{position:absolute;transform-origin:50% 100%;animation:sw2 4.5s ease-in-out infinite alternate}
@keyframes sw2{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.fs{position:absolute;width:var(--s);left:var(--x);top:var(--y);animation:fsb var(--t) ease-in-out var(--d) infinite alternate}
@keyframes fsb{from{transform:rotate(-10deg) scale(.9)}to{transform:rotate(10deg) scale(1.08)}}
#courier{position:absolute;left:0;bottom:calc(9vh + 30px);width:min(28vw,120px);z-index:3}
#courier svg{width:100%;overflow:visible;filter:drop-shadow(0 8px 8px rgba(110,140,190,.22))}
#courier.leave{transform:translateX(-130vw);transition:transform 2.4s ease-in}
#s2.on #courier{animation:cin 1.4s ease-out backwards}
@keyframes cin{from{transform:translateX(-60vw)}}
.cbob{transform-box:fill-box;transform-origin:50% 100%;animation:cb 1.4s ease-in-out infinite alternate}
@keyframes cb{to{transform:translateY(-4px)}}
.leave .cbob{animation-duration:.4s}
.wave{transform-box:view-box;transform-origin:114px 112px;animation:wv 1s ease-in-out infinite alternate}
@keyframes wv{from{transform:rotate(-14deg)}to{transform:rotate(12deg)}}
.sb{position:absolute;left:4px;bottom:100%;margin-bottom:6px;white-space:nowrap;background:#fff;color:var(--ink);font-size:14px;padding:7px 14px;border-radius:18px;box-shadow:0 5px 14px rgba(120,160,215,.25);animation:hb 2.4s ease-in-out infinite}
.sb:after{content:"";position:absolute;left:26px;top:100%;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
#box{position:absolute;left:50%;bottom:calc(10vh + 30px);width:min(66vw,280px);margin-left:calc(min(66vw,280px) / -2);z-index:4;cursor:pointer;transition:transform 1s ease-in,opacity 1s}
#box svg{width:100%;overflow:visible;filter:drop-shadow(0 10px 10px rgba(110,140,190,.28));animation:bxp 2s ease-in-out infinite}
@keyframes bxp{50%{transform:translateY(-4px) scale(1.02)}}
#box.open svg{animation:none}
#box .lid{transform-box:fill-box;transform-origin:0 100%;transition:transform .8s cubic-bezier(.3,1.3,.5,1)}
#box.open .lid{transform:translate(-30px,-80px) rotate(-28deg)}
#box.sink{transform:translateY(70px);opacity:0;pointer-events:none}
#stage{transition:transform 2s cubic-bezier(.65,0,.35,1),opacity .7s ease}
#stage.pre{opacity:0;transform:translateY(34vh) scale(.45);pointer-events:none}
#cat2{left:auto;right:2vw;width:min(36vw,150px)}
.pp{position:fixed;z-index:6;width:var(--s);pointer-events:none;animation:pp 1.7s ease-out forwards}
@keyframes pp{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1);opacity:0}}
.cur{transform-box:fill-box;transform-origin:50% 0;animation:cs 6s ease-in-out infinite alternate}
@keyframes cs{to{transform:skewX(2deg)}}
.bulb{animation:bt 2.4s ease-in-out infinite alternate}
@keyframes bt{from{opacity:.35}to{opacity:1}}
.lampg{animation:lpg 4s ease-in-out infinite alternate}
@keyframes lpg{to{opacity:.55}}
.oc1{animation:oc 40s ease-in-out infinite alternate}.oc2{animation:oc 55s ease-in-out -20s infinite alternate}
@keyframes oc{from{transform:translateX(-26px)}to{transform:translateX(40px)}}
.bird{animation:bd 14s linear infinite}@keyframes bd{from{transform:translate(-30px,6px)}to{transform:translate(130px,-14px)}}
.brth{transform-box:fill-box;transform-origin:50% 100%;animation:br 3.8s ease-in-out infinite}
.zz text{opacity:0;animation:zq 3.6s ease-in-out infinite}.zz text:nth-child(2){animation-delay:.9s}.zz text:nth-child(3){animation-delay:1.8s}
@keyframes zq{0%{opacity:0;transform:translateY(6px)}35%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
#box{position:fixed;left:0;top:0;width:110px;margin:0;bottom:auto}
#stage.pre{opacity:0;transform:translate(var(--px,0px),var(--py,0px)) scale(.3);pointer-events:none}
.hang{transform-box:view-box;transform-origin:80px 14px;animation:hg 5s ease-in-out infinite alternate}
@keyframes hg{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
#deco{transition:opacity .9s ease}body[data-sc="1"] #deco{opacity:0}
.nb{font-size:clamp(15px,4vw,18px);padding:10px 18px 10px 12px;color:#3f6ea8}.nb svg{width:22px}.hdz{transform-box:fill-box;transform-origin:50% 100%;animation:hz 4.4s ease-in-out infinite}@keyframes hz{50%{transform:rotate(-1.5deg) translateY(-1px)}}
</style>
</head>
<body data-sc="1">
<div class="glow" style="width:60vmax;height:60vmax;left:-20vmax;top:-18vmax"></div>
<div class="glow" style="width:50vmax;height:50vmax;right:-16vmax;bottom:-14vmax;animation-delay:-4s"></div>
<div id="fx"></div>
<div id="deco"></div>
<div id="mbw"><span id="ml">แตะเพื่อเปิดเพลง</span><button class="mb off" id="mb" aria-label="music"><svg viewBox="0 0 24 24"><path d="M9 18V6l9-2v12" fill="none" stroke="#3f6ea8" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="7" cy="18" rx="3.200" ry="2.600" fill="#4f86c6"/><ellipse cx="16" cy="16" rx="3.200" ry="2.600" fill="#4f86c6"/><path class="sl" d="M3 3L21 21" stroke="#e58aa3" stroke-width="2.2" stroke-linecap="round"/></svg></button></div>

<!-- PAGE 1 -->
<section class="scene on" id="s1">
  <div id="catwrap"><svg id="cat" viewBox="0 0 300 340"></svg></div>
  <h1 id="title"></h1>
  <button class="btn" id="openBtn">เปิด<svg viewBox="0 0 20 20"><path d="M10 1c.6 4.6 2.4 7.4 9 9-6.6 1.6-8.4 4.4-9 9-.6-4.6-2.4-7.4-9-9 6.6-1.6 8.4-4.4 9-9z" fill="#fff"/></svg></button>
</section>

<!-- PAGE 2 -->
<section class="scene" id="s2">

  <div class="nav"><button class="nb" id="bBack2"><svg viewBox="0 0 20 20"><path d="M12 3C7 6 5 9 4 10c1 1 3 4 8 7" fill="none" stroke="#4f78a8" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"/></svg>ย้อนกลับ</button></div>

<path d="M30 100H270L258 190Q256 204 242 204H58Q44 204 42 190Z" fill="url(#bxg)" stroke="#ee8aab" stroke-width="2" stroke-linejoin="round"/>

<ellipse cx="90" cy="168" rx="12" ry="6.500" fill="#ff8fb0" opacity=".65"/><ellipse cx="210" cy="168" rx="12" ry="6.500" fill="#ff8fb0" opacity=".65"/>
<path d="M138 164Q150 178 162 164" stroke="#5a3a48" stroke-width="3" stroke-linecap="round" fill="none"/>
<g class="lid">
<g fill="#ffcade" stroke="#ee8aab" stroke-width="1.500"><circle cx="36" cy="100" r="12"/><circle cx="60" cy="100" r="12"/><circle cx="84" cy="100" r="12"/><circle cx="108" cy="100" r="12"/><circle cx="132" cy="100" r="12"/><circle cx="156" cy="100" r="12"/><circle cx="180" cy="100" r="12"/><circle cx="204" cy="100" r="12"/><circle cx="228" cy="100" r="12"/><circle cx="252" cy="100" r="12"/></g>
<rect x="14" y="46" width="272" height="54" rx="18" fill="url(#bxl)" stroke="#ee8aab" stroke-width="2"/>
<g fill="#fff" opacity=".8"><circle cx="40" cy="64" r="5"/><circle cx="70" cy="82" r="4"/><circle cx="104" cy="62" r="3.500"/><circle cx="198" cy="62" r="3.500"/><circle cx="232" cy="82" r="4"/><circle cx="260" cy="64" r="5"/></g>
<path d="M30 58Q60 52 90 54" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" opacity=".7"/>
<rect x="136" y="46" width="28" height="54" fill="#bfdcf5" stroke="#8fbbe3" stroke-width="1.500"/><path d="M142 48V98M158 48V98" stroke="#fff" stroke-width="1.400" stroke-dasharray="3 4" opacity=".8"/>

<path d="M142 46C124 26 104 26 98 38M158 46C176 26 196 26 202 38" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".8"/>

let AC=null,mg=null,mOn=false,startedAt=0;
const NF={C4:261.63,E4:329.63,G4:392,A3:220,F3:174.61,B3:246.94,D4:293.66,G3:196,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880};
const BT=.62,CH=[['C4','E4','G4'],['A3','C4','E4'],['F3','A3','C4'],['G3','B3','D4']];
const ML=[[['E5',0,1],['G5',1,1],['E5',2,1],['C5',3,1]],[['E5',0,1.5],['D5',1.5,.5],['C5',2,2]],[['C5',0,1],['F5',1,1],['A5',2,1],['G5',3,1]],[['D5',0,1.5],['E5',1.5,.5],['D5',2,2]]];
function bell(f,t,d,v){const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),g2=AC.createGain();o.frequency.value=f;o2.type='triangle';o2.frequency.value=f*2;g2.gain.value=.16;o2.connect(g2);g2.connect(g);o.connect(g);g.connect(mg);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.start(t);o2.start(t);o.stop(t+d+.1);o2.stop(t+d+.1)}
function mloop(t0){for(let b=0;b<4;b++){const base=t0+b*4*BT;[0,1,2,1,0,1,2,1].forEach((ix,k)=>bell(NF[CH[b][ix]],base+k*BT/2,1.3,.05));ML[b].forEach(([n,s,d])=>bell(NF[n],base+s*BT,2.4,.12))}
 const nx=t0+16*BT;setTimeout(()=>mloop(nx),Math.max(100,(nx-AC.currentTime-1.2)*1000))}
function musicUI(){const b=$('mb');b.classList.toggle('off',!mOn);$('ml').style.display=startedAt?'none':''}
function startMusic(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 mg=AC.createGain();mg.gain.value=0;const dl=AC.createDelay(1),fb=AC.createGain(),wet=AC.createGain();dl.delayTime.value=.38;fb.gain.value=.38;wet.gain.value=.5;
 mg.connect(AC.destination);mg.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(AC.destination);
 mOn=true;startedAt=Date.now();AC.resume();mg.gain.linearRampToValueAtTime(.85,AC.currentTime+3);mloop(AC.currentTime+.3);musicUI()}
['pointerdown','touchend','keydown'].forEach(ev=>addEventListener(ev,()=>{if(!AC)startMusic();else if(AC.state==='suspended')AC.resume()},{passive:true}));
$('mb').addEventListener('click',()=>{if(Date.now()-startedAt<700)return;if(!AC){startMusic();return}mOn=!mOn;mg.gain.cancelScheduledValues(AC.currentTime);mg.gain.linearRampToValueAtTime(mOn?.85:0,AC.currentTime+.6);musicUI()});

function fitRoom(){const W=innerWidth,H=innerHeight,a=W/H,h=Math.max(340/a,420),w=h*a,x0=210-w/2,y0=Math.max(90,810-h);
 const v=$('rsvg');if(!v)return null;v.setAttribute('viewBox',`${x0} ${y0} ${w} ${h}`);const g=$('vgr');g.setAttribute('x',x0);g.setAttribute('y',y0);g.setAttribute('width',w);g.setAttribute('height',h);return{x0,y0,s:W/w}}
function placeBox(){const f=fitRoom();if(!f)return;const s=f.s,ox=-f.x0*s,oy=-f.y0*s,bx=$('box');bx.style.left=F(ox+226*s)+'px';bx.style.top=F(oy+506*s)+'px';bx.style.width=F(110*s)+'px';
 $('stage').style.setProperty('--px',F(ox+281*s-innerWidth/2)+'px');$('stage').style.setProperty('--py',F(oy+545*s-innerHeight/2)+'px')}
