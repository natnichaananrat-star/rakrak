<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One More Chance 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Cherry+Bomb+One&family=Fredoka:wght@400;500;600&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff4f6;--bg2:#eaf4ff;--ink:#7a4a5c;--soft:#b98a9b;--pink:#ffb3c6;--pink2:#ff8fab;--blue:#bfe0ff;--cream:#fff8ec;--card:#fffdf8;--sh:rgba(255,143,171,.25)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b1f27;--bg2:#1f2733;--ink:#ffd9e3;--soft:#d9a9b9;--card:#3a2a33;--cream:#4a3640;--sh:rgba(0,0,0,.35)}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Fredoka','Trebuchet MS',sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--cream) 50%,var(--bg2));overflow-x:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 20px 40px}
h1,h2{font-family:'Pacifico','Brush Script MT',cursive;font-weight:400}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.f{position:absolute;bottom:-40px;animation:rise linear infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-110vh) translateX(30px);opacity:0}}
.sp{position:absolute;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
.admin-btn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:5;font:500 .8rem 'Fredoka',sans-serif;border:0;border-radius:999px;padding:7px 14px;background:var(--card);color:var(--soft);box-shadow:0 3px 10px var(--sh);cursor:pointer}
main{position:relative;z-index:1;width:100%;max-width:520px;text-align:center}
.brand{font-size:1.1rem;color:var(--soft);margin:0 0 6px}
.env{width:150px;height:130px;margin:0 auto 6px;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(2deg)}}
.flap{transform-origin:75px 48px;animation:flap 3.2s ease-in-out infinite}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.82)}}
.beat{transform-origin:center;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}}
.q{font-size:clamp(1.9rem,7vw,2.8rem);line-height:1.25;margin:10px 0 26px;color:var(--pink2);text-shadow:0 2px 0 #fff}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
button{font-family:'Fredoka',sans-serif;cursor:pointer;transition:transform .15s,box-shadow .15s}
.b{border:0;border-radius:999px;padding:14px 28px;font-size:1.1rem;font-weight:500;box-shadow:0 6px 16px var(--sh)}
.b:hover{transform:translateY(-3px) scale(1.04)}.b:active{transform:scale(.97)}
.yes{background:linear-gradient(135deg,#ffb3c6,#ff8fab);color:#fff}
.no{background:var(--blue);color:#4f7596}
.b:disabled{opacity:.6;cursor:default;transform:none}
.card{background:var(--card);border-radius:28px;padding:26px 22px;box-shadow:0 10px 30px var(--sh);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.big{width:90px;height:90px;margin:0 auto 8px}
.msg{font-size:1.4rem;margin:6px 0 0}
.note{font-size:.85rem;color:var(--soft);margin-top:14px}
.hidden{display:none!important}
.modal{position:fixed;inset:0;z-index:10;background:rgba(122,74,92,.3);display:flex;align-items:center;justify-content:center;padding:20px}
.panel{width:100%;max-width:320px;text-align:center}
input{width:100%;padding:12px 16px;border-radius:999px;border:2px solid var(--pink);background:var(--cream);color:var(--ink);font:1rem 'Fredoka',sans-serif;text-align:center;margin:12px 0 8px;outline:none}
input:focus{border-color:var(--pink2)}
.err{color:#d9546f;font-size:.9rem;min-height:1.2em;margin:4px 0 10px}
.small{border:0;background:none;color:var(--soft);margin-top:10px;font-size:.9rem;text-decoration:underline}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat{background:var(--cream);border-radius:18px;padding:12px 4px}.stat b{display:block;font-size:1.7rem;color:var(--pink2)}.stat span{font-size:.8rem;color:var(--soft)}
.list{max-height:40vh;overflow-y:auto;text-align:left;margin:0 0 14px;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:14px;background:var(--cream);margin-bottom:8px;font-size:.92rem}
.tag{font-weight:600}.tag.y{color:var(--pink2)}.tag.n{color:#6f9cc4}
body,button,input,.admin-btn{font-family:'Baloo 2','Fredoka','Trebuchet MS',sans-serif!important}
h1,h2,.brand{font-family:'Cherry Bomb One','Pacifico','Brush Script MT',cursive!important;font-weight:400}
.q{letter-spacing:.5px;text-shadow:0 3px 0 #fff,0 6px 14px var(--sh)}
.brand{letter-spacing:1px;font-size:1.25rem}
</style></head>
<body>
<div id="fx"></div>
<button class="admin-btn" id="adminBtn">Admin</button>

<main id="home">
  <p class="brand">One More Chance</p>
  <svg class="env" viewBox="0 0 150 130" aria-hidden="true">
    <rect x="15" y="40" width="120" height="80" rx="14" fill="#fff8ec" stroke="#ffb3c6" stroke-width="3"/>
    <path d="M18 46 L75 92 L132 46" fill="none" stroke="#bfe0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="flap"><path d="M15 54 Q15 40 29 40 H121 Q135 40 135 54 L75 96 Z" fill="#ffd9e3" stroke="#ffb3c6" stroke-width="3" stroke-linejoin="round"/></g>
    <path class="beat" d="M75 84 C52 66 58 48 70 52 C73 53 75 56 75 58 C75 56 77 53 80 52 C92 48 98 66 75 84Z" fill="#ff8fab" transform="translate(0,-14)"/>
    <circle cx="30" cy="22" r="3" fill="#bfe0ff"/><circle cx="125" cy="18" r="4" fill="#ffd9e3"/>
  </svg>
  <h1 class="q" id="qTitle">Can we get back together, please?</h1>
  <div class="row" id="btns">
    <button class="b yes" id="yes">Yes, Please! ♡</button>
    <button class="b no" id="no">No</button>
  </div>
  <div id="result" class="card hidden"></div>
  <p class="note hidden" id="saveNote"></p>
</main>

<div class="modal hidden" id="loginModal"><div class="card panel">
  <h2 style="margin:0;color:var(--pink2)">Admin</h2>
  <form id="loginForm" action="javascript:void(0)" novalidate>
    <input id="pw" type="password" inputmode="numeric" placeholder="Admin password" autocomplete="off">
    <div class="err" id="loginErr"></div>
    <button class="b yes" id="loginGo" type="submit" style="padding:10px 26px">Login</button>
  </form>
  <button class="b no" id="loginClose" type="button" style="padding:8px 24px;font-size:.95rem;margin-top:12px">Close</button>
</div></div>

<main id="dash" class="hidden"><div class="card">
  <h2 style="margin:0;color:var(--pink2);font-size:1.8rem">Admin Dashboard</h2>
  <div class="stats"><div class="stat"><b id="sT">0</b><span>Total</span></div><div class="stat"><b id="sY">0</b><span>Yes, Please!</span></div><div class="stat"><b id="sN">0</b><span>No</span></div></div>
  <ul class="list" id="list"></ul>
  <button class="b yes" id="back" style="padding:10px 26px">Back to main page</button>
</div></main>

<script>
(function(){
const $=id=>document.getElementById(id);
// decorations: tiny hearts + sparkles
const fx=$('fx'),cols=['#ffb3c6','#ff8fab','#bfe0ff','#ffd9e3'];
const heart=(c,s)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M12 21C4 14 3 9 6 6.5 8.5 4.5 11 6 12 8c1-2 3.5-3.500 6-1.500 3 2.500 2 7.500-6 14.500z" fill="${c}"/></svg>`;
for(let i=0;i<16;i++){const d=document.createElement('div');d.className='f';d.style.left=Math.random()*100+'%';d.style.animationDuration=(9+Math.random()*10)+'s';d.style.animationDelay=(-Math.random()*15)+'s';d.innerHTML=heart(cols[i%4],10+Math.random()*14);fx.appendChild(d)}
for(let i=0;i<14;i++){const d=document.createElement('div');d.className='sp';d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';d.style.animationDelay=Math.random()*3+'s';d.innerHTML=`<svg width="14" height="14" viewBox="0 0 20 20"><path d="M10 0 12 8 20 10 12 12 10 20 8 12 0 10 8 8Z" fill="${i%2?'#bfe0ff':'#ffe3a8'}"/></svg>`;fx.appendChild(d)}

let db=null,uid=null,user=null;
(async()=>{try{user=await claude.use('user');db=await claude.use('db');if(user)uid=await user.id()}catch(e){db=null}})();
// wait helper (capabilities resolve a moment after load)
const ready=async()=>{for(let i=0;i<30&&!(db&&uid);i++)await new Promise(r=>setTimeout(r,200));return !!(db&&uid)};

const bigHeart=`<svg class="big beat" viewBox="0 0 24 24"><path d="M12 21C4 14 3 9 6 6.500 8.500 4.500 11 6 12 8c1-2 3.500-3.500 6-1.500 3 2.500 2 7.500-6 14.500z" fill="#ff8fab"/></svg>`;
async function answer(a){
  $('yes').disabled=$('no').disabled=true;
  $('btns').classList.add('hidden');$('qTitle').classList.add('hidden');
  const r=$('result');r.classList.remove('hidden');
  r.innerHTML=(a==='yes'?bigHeart+'<p class="msg">Really? You\u2019ve made me so happy! \u2661</p>':'<p class="msg">I understand. Thank you for being honest. \u2661</p>');
  const n=$('saveNote');
  try{
    if(!(await ready()))throw 0;
    await db.collection('responses').doc(uid).set({answer:a,at:new Date().toISOString()});
  }catch(e){n.textContent='Your answer could not be saved this time.';n.classList.remove('hidden')}
}
$('yes').onclick=()=>answer('yes');$('no').onclick=()=>answer('no');

// admin
const open=()=>{$('loginModal').classList.remove('hidden');$('pw').value='';$('loginErr').textContent='';$('pw').focus()};
$('adminBtn').onclick=open;$('loginClose').onclick=()=>$('loginModal').classList.add('hidden');
function sha(s){s='omc:'+s;const b=unescape(encodeURIComponent(s)),K=[],H=[];let p=0,c={};for(let i=2;p<64;i++){if(!c[i]){for(let j=i*i;j<313;j+=i)c[j]=1;K[p]=(Math.pow(i,1/3)*4294967296)|0;if(p<8)H[p]=(Math.pow(i,.5)*4294967296)|0;p++}}
const w=[],l=b.length*8;let m=b+'\x80';while(m.length%64-56)m+='\0';for(let i=0;i<m.length;i++)w[i>>2]|=m.charCodeAt(i)<<(24-(i%4)*8);w[w.length]=Math.floor(l/4294967296);w[w.length]=l;
for(let j=0;j<w.length;){const v=w.slice(j,j+=16),o=H.slice(0);for(let i=0;i<64;i++){const a=v[i-15],e=v[i-2],x=o[0],y=o[4];const t=o[7]+(((y>>>6)|(y<<26))^((y>>>11)|(y<<21))^((y>>>25)|(y<<7)))+((y&o[5])^(~y&o[6]))+K[i]+(v[i]=i<16?v[i]:(v[i-16]+(((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3))+v[i-7]+(((e>>>17)|(e<<15))^((e>>>19)|(e<<13))^(e>>>10)))|0);const q=(((x>>>2)|(x<<30))^((x>>>13)|(x<<19))^((x>>>22)|(x<<10)))+((x&o[1])^(x&o[2])^(o[1]&o[2]));o.unshift((t+q)|0);o[4]=(o[4]+t)|0;o.pop()}for(let i=0;i<8;i++)H[i]=(H[i]+o[i])|0}
return H.map(n=>('00000000'+(n>>>0).toString(16)).slice(-8)).join('')}
let busy=false;
async function login(){
  if(busy)return;busy=true;
  const err=$('loginErr'),go=$('loginGo');err.style.color='';err.textContent='Checking\u2026';go.disabled=true;
  const fail=m=>{err.style.color='#d9546f';err.textContent=m||'Incorrect password. Please try again.'};
  try{
    const pw=$('pw').value.trim();
    if(!pw)return fail();
    if(!(await ready()))return fail('Database unavailable. Open this page in claude.ai while signed in as the owner.');
    let snap;
    try{snap=await db.doc('admin/config').get()}catch(e){console.error('admin/config read failed',e);return fail()}  // only the administrator can read this
    if(!snap.exists||snap.data().hash!==sha(pw))return fail();
    let rows=[];
    try{const all=await db.collection('responses').get();rows=all.docs.map(d=>d.data()).filter(r=>r&&r.at)}catch(e){console.error('responses read failed',e)}
    err.textContent='';show(rows);
  }catch(e){console.error('login error',e);fail('Something went wrong. Please try again.')}
  finally{busy=false;go.disabled=false}
}
$('loginForm').addEventListener('submit',e=>{e.preventDefault();login()});
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();login()}});
$('loginGo').addEventListener('click',e=>{e.preventDefault();login()});
function show(rows){
  rows.sort((a,b)=>b.at.localeCompare(a.at));
  const y=rows.filter(r=>r.answer==='yes').length;
  $('sT').textContent=rows.length;$('sY').textContent=y;$('sN').textContent=rows.length-y;
  const L=$('list');L.innerHTML='';
  if(!rows.length)L.innerHTML='<li>No responses yet.</li>';
  rows.forEach(r=>{const li=document.createElement('li');const t=document.createElement('span');t.className='tag '+(r.answer==='yes'?'y':'n');t.textContent=r.answer==='yes'?'Yes, Please! \u2661':'No';const d=document.createElement('span');d.textContent=new Date(r.at).toLocaleString();li.append(t,d);L.appendChild(li)});
  $('loginModal').classList.add('hidden');$('home').classList.add('hidden');$('adminBtn').classList.add('hidden');$('dash').classList.remove('hidden');
}
$('back').onclick=()=>{$('dash').classList.add('hidden');$('list').innerHTML='';$('home').classList.remove('hidden');$('adminBtn').classList.remove('hidden')};
})();
</script></body></html>
